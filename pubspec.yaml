name: wekend_masti
description: "Wekend Masti - Food Delivery App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0

  # State Management & Navigation
  get: ^4.6.6

  # Storage & Preferences
  shared_preferences: ^2.3.2

  # Voice Search
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  geolocator: ^13.0.1

  # Maps & Location Picker
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0

  # QR Check-in
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Profile Photo
  image_picker: ^1.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
